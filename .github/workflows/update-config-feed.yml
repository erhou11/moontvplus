name: Update config feed
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Build feed
        run: |
          curl -fsSL "https://raw.githubusercontent.com/666zmy/MoonTV/refs/heads/main/config.json" -o /tmp/config.json
          python3 - <<'PY'
          import json
          data = open('/tmp/config.json','rb').read()
          cfg = json.loads(data)
          assert 'api_site' in cfg and len(cfg['api_site']) > 0
          ALPH = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          n = int.from_bytes(data, 'big')
          s = ''
          while n > 0:
              n, r = divmod(n, 58)
              s = ALPH[r] + s
          pad = len(data) - len(data.lstrip(b'\x00'))
          open('/tmp/feed.txt','w').write('1' * pad + s)
          print('sources:', len(cfg['api_site']))
          PY
      - name: Publish to config-feed branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp && rm -rf feedrepo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/erhou11/moontvplus.git" feedrepo
          cd feedrepo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin config-feed >/dev/null 2>&1; then
            git fetch origin config-feed && git checkout config-feed
          else
            git checkout --orphan config-feed
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/feed.txt config-feed.txt
          git add config-feed.txt
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update config feed"
          git push origin config-feed
